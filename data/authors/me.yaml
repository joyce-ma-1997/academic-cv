bio: |-
  My name is Joyce. My Mandarin name is Heqiao, pronounced “huh-CHEE-ow.” I am a PhD Candidate 
  in Strategy at Duke University's Fuqua School of Business.

  My research lies at the intersection of non-market strategy, entrepreneurship, and innovation. 
  I study how innovative firms and entrepreneurs shape the institutional environment alongside policymakers, 
  how they respond to institutional changes, and how startups and incumbents interact within the innovation ecosystem.
  My work combines novel data sources with text analysis, machine learning, AI, and causal inference.

  Prior to my PhD, I earned a Master's degree in Economics from Duke University and conducted policy 
  research at a leading think tank in China.

  I am on the 2026-2027 academic job market.

